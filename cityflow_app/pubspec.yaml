name: cityflow_app
description: "CityFlow AI — prédiction de congestion pour Abidjan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  provider: ^6.1.2
  intl: ^0.20.2
  fl_chart: ^0.69.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_cityflow.svg

  # Police Inter chargée via le package google_fonts (voir theme/app_theme.dart)
  # plutôt que bundlée en .ttf localement — voir la note dans ce fichier.
